# Wdrożenie serwera gry na żywo w Cloudflare Workers (instrukcja: server/README.md).
name = "falszywe-alibi"
main = "server/worker.js"
compatibility_date = "2024-09-23"

# Każdy pokój to osobny Durable Object klasy Room.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Durable Objects na SQLite działają w darmowym planie.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
